<div class="ownership-calculator" data-ownership data-drive="{{car.drive_type}}"><div class="ownership-inputs"><div class="calculator-heading"><h3>{{car.make}} <bdi>{{car.model}}</bdi></h3><span class="missing-chip">תרחיש אישי</span></div><div class="input-pair"><div><label for="km-{{car.id}}">קילומטרים בשנה</label><input id="km-{{car.id}}" data-annual type="number" min="0" max="200000" value="15000"></div><div><label for="mode-{{car.id}}">סוג החישוב</label><select id="mode-{{car.id}}" data-energy-mode><option value="fuel" {{'selected' if car.drive_type not in ['electric','plugin']}}>דלק</option><option value="electric" {{'selected' if car.drive_type=='electric'}}>חשמל</option><option value="plugin" {{'selected' if car.drive_type=='plugin'}}>פלאג־אין / שילוב</option></select></div></div><div class="input-pair" data-fuel-fields><div><label for="cons-{{car.id}}">צריכה משוערת, ל׳/100 ק״מ</label><input id="cons-{{car.id}}" data-consumption type="number" min="0.1" max="50" step="0.1" placeholder="ההערכה שלך" value="{{car.consumption_l100 or ''}}"></div><div><label for="fuel-{{car.id}}">מחיר ליטר, ₪</label><input id="fuel-{{car.id}}" data-fuel-tariff type="number" min="0.1" max="50" step="0.01" placeholder="לפי התדלוק שלך"></div></div><div class="input-pair" data-electric-fields hidden><div><label for="kwh-{{car.id}}">צריכה, קוט״ש/100 ק״מ</label><input id="kwh-{{car.id}}" data-electric-consumption type="number" min="0.1" max="100" step="0.1" placeholder="ההערכה שלך"></div><div><label for="tariff-{{car.id}}">מחיר קוט״ש, ₪</label><input id="tariff-{{car.id}}" data-electric-tariff type="number" min="0.01" max="20" step="0.01" placeholder="ממוצע הטעינה שלך"></div></div><div data-plugin-fields hidden><label for="share-{{car.id}}">אחוז מהקילומטרים על חשמל</label><input id="share-{{car.id}}" data-electric-share type="number" min="0" max="100" placeholder="0–100"></div><details><summary>ביטוח, תחזוקה וירידת ערך</summary><div class="input-pair"><div><label for="insurance-{{car.id}}">ביטוח שנתי, ₪</label><input id="insurance-{{car.id}}" data-extra="insurance" type="number" min="0" max="200000" placeholder="לפי הצעה שקיבלת"></div><div><label for="maint-{{car.id}}">תחזוקה שנתית, ₪</label><input id="maint-{{car.id}}" data-extra="maintenance" type="number" min="0" max="200000" placeholder="ההערכה שלך"></div></div><label for="depreciation-{{car.id}}">ירידת ערך שנתית משוערת, ₪</label><input id="depreciation-{{car.id}}" data-extra="depreciation" type="number" min="0" max="1000000" placeholder="סכום ההערכה שלך"></details></div><div class="ownership-result"><p class="eyebrow">YOUR SCENARIO / לחודש</p><output data-ownership-total aria-live="polite">—</output><p data-calculation-message>הזינו צריכה ותעריף כדי לחשב.</p><dl class="cost-breakdown"><div><dt>דלק / טעינה</dt><dd data-energy-result>—</dd></div><div><dt>ביטוח</dt><dd data-insurance-result>לא הוזן</dd></div><div><dt>תחזוקה</dt><dd data-maintenance-result>לא הוזן</dd></div><div><dt>ירידת ערך</dt><dd data-depreciation-result>לא הוזן</dd></div></dl><small>רק הוצאות שהזנת נכללות בסכום. זהו תרחיש, לא תחזית או הצעת מחיר. ללא רכישה, מימון, חניה ואגרות.</small></div></div>
